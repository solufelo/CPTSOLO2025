<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />

    <!-- Apply theme before paint so the white/blue default never flashes -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('portfolio-theme');
          if (!t || ['dark', 'glass', 'light'].indexOf(t) === -1) t = 'light';
          document.documentElement.classList.add('theme-' + t);
          document.documentElement.style.colorScheme = t === 'light' ? 'light' : 'dark';
        } catch (e) {
          document.documentElement.classList.add('theme-light');
        }
      })();
    </script>

    <!-- Fonts: Oswald (display) + IBM Plex Sans (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" />
    
    <!-- SEO Meta Tags -->
    <title>Solomon Olufelo — Full-Stack Developer & Creative Technologist | Captain Solo</title>
    <meta name="description" content="Solomon Olufelo (Captain Solo) — full-stack developer and creative technologist in Brampton, ON. Web apps, interactive demos, motion and video work." />
    <meta name="keywords" content="full-stack developer, creative technologist, web development, React, C++, WebAssembly, motion design, Solomon Olufelo, Captain Solo, Brampton developer" />
    <meta name="author" content="Solomon Olufelo" />
    
    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://captainsolo.ca/" />
    <meta property="og:title" content="Solomon Olufelo — Full-Stack Developer & Creative Technologist" />
    <meta property="og:description" content="Captain Solo — full-stack developer building web apps, interactive demos, and motion work out of Brampton." />
    <meta property="og:image" content="/assets/og-image.jpg" />
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Solomon Olufelo — Full-Stack Developer & Creative Technologist" />
    <meta name="twitter:description" content="Building digital experiences and capturing stories. 1,400+ projects, 4.8★ rating." />
    <meta name="twitter:image" content="/assets/twitter-card.jpg" />
    
    <!-- Theme Color (light/white default) -->
    <meta name="theme-color" content="#fafafa" />
  </head>
